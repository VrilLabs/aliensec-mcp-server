<svg xmlns="http://www.w3.org/2000/svg" width="220" height="64" viewBox="0 0 220 64" role="img" aria-label="GitHub Sponsors - RECURRING SUPPORT">
  <defs>
    <linearGradient id="d0-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10131A"/>
      <stop offset="100%" stop-color="#080A0E"/>
    </linearGradient>
    <linearGradient id="d0-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="d0-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9C0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00D9C0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="d0-clip">
      <rect x="0.75" y="0.75" width="218.5" height="62.5" rx="14"/>
    </clipPath>
    <filter id="d0-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <g clip-path="url(#d0-clip)">
    <rect x="0.75" y="0.75" width="218.5" height="62.5" rx="14" fill="url(#d0-bg)"/>

    <circle cx="30" cy="32" r="22" fill="url(#d0-glow)" filter="url(#d0-blur)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <rect x="0.75" y="0.75" width="218.5" height="62.5" rx="14" fill="url(#d0-shimmer)">
      <animateTransform attributeName="transform" type="translate" values="-220 0; 220 0; -220 0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.75" y="0.75" width="218.5" height="62.5" rx="14" fill="none" stroke="#6272A4" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="0.75" y="0.75" width="218.5" height="62.5" rx="14" fill="none" stroke="#00D9C0" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 27">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(16, 22)" fill="none" stroke="#00D9C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
  </g>

  <text x="46" y="27" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="-0.2" fill="#E8EDF5">GitHub Sponsors</text>
  <text x="46" y="41" font-family="ui-monospace, 'SF Mono', 'Fira Code', Consolas, monospace" font-size="8.5" letter-spacing="1" fill="#6272A4">// RECURRING SUPPORT</text>
</svg>
