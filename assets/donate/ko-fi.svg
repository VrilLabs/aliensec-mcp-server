<svg xmlns="http://www.w3.org/2000/svg" width="220" height="64" viewBox="0 0 220 64" role="img" aria-label="Ko-fi - ONE-TIME TIP">
  <defs>
    <linearGradient id="d2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10131A"/>
      <stop offset="100%" stop-color="#080A0E"/>
    </linearGradient>
    <linearGradient id="d2-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="d2-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9C0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00D9C0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="d2-clip">
      <rect x="0.75" y="0.75" width="218.5" height="62.5" rx="14"/>
    </clipPath>
    <filter id="d2-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <g clip-path="url(#d2-clip)">
    <rect x="0.75" y="0.75" width="218.5" height="62.5" rx="14" fill="url(#d2-bg)"/>

    <circle cx="30" cy="32" r="22" fill="url(#d2-glow)" filter="url(#d2-blur)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <rect x="0.75" y="0.75" width="218.5" height="62.5" rx="14" fill="url(#d2-shimmer)">
      <animateTransform attributeName="transform" type="translate" values="-220 0; 220 0; -220 0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.75" y="0.75" width="218.5" height="62.5" rx="14" fill="none" stroke="#6272A4" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="0.75" y="0.75" width="218.5" height="62.5" rx="14" fill="none" stroke="#00D9C0" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 27">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(16, 22)" fill="none" stroke="#00D9C0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3h10l-1.1 15.2a2 2 0 0 1-2 1.8h-3.8a2 2 0 0 1-2-1.8L7 3z"/><path d="M5.2 3h13.6"/><path d="M12 3V1"/><path d="M9.5 9h5"/>
  </g>

  <text x="46" y="27" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="-0.2" fill="#E8EDF5">Ko-fi</text>
  <text x="46" y="41" font-family="ui-monospace, 'SF Mono', 'Fira Code', Consolas, monospace" font-size="8.5" letter-spacing="1" fill="#6272A4">// ONE-TIME TIP</text>
</svg>
