<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B8BBE"/>
      <stop offset="50%" stop-color="#306BAC"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="scanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4B8BBE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4B8BBE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4B8BBE" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="240" fill="#0A1929"/>
  
  <!-- Subtle grid lines -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E3A5F" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="800" height="240" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Shield Base -->
  <path id="shield" d="M 400 50 L 650 140 L 400 170 L 150 140 Z" fill="url(#shieldGradient)" filter="url(#glow)">
    <animate attributeName="fill" values="url(#shieldGradient);#5DADE2;url(#shieldGradient)" dur="6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Shield Outline -->
  <path d="M 400 50 L 650 140 L 400 170 L 150 140 Z" fill="none" stroke="#4B8BBE" stroke-width="2">
    <animate attributeName="stroke" values="#4B8BBE;#85C1E9;#4B8BBE" dur="4s" repeatCount="indefinite"/>
  </path>
  
  <!-- Scan Lines (Animated) -->
  <g id="scanLines">
    <rect x="150" y="50" width="500" height="1" fill="url(#scanGradient)" opacity="0.6">
      <animate attributeName="y" values="50;170;50" dur="3s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0.6;0.8;0.6" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="150" y="90" width="500" height="1" fill="url(#scanGradient)" opacity="0.4">
      <animate attributeName="y" values="90;210;90" dur="3.5s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0.4;0.6;0.4" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="150" y="130" width="500" height="1" fill="url(#scanGradient)" opacity="0.3">
      <animate attributeName="y" values="130;250;130" dur="4s" repeatCount="indefinite" calcMode="linear"/>
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Security Nodes (Minimalist) -->
  <circle cx="250" cy="90" r="4" fill="#4B8BBE">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#4B8BBE;#85C1E9;#4B8BBE" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="90" r="4" fill="#4B8BBE">
    <animate attributeName="r" values="4;6;4" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#4B8BBE;#85C1E9;#4B8BBE" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="130" r="4" fill="#4B8BBE">
    <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#4B8BBE;#85C1E9;#4B8BBE" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection Lines (Pulsing) -->
  <line x1="250" y1="90" x2="400" y2="130" stroke="#4B8BBE" stroke-width="1" stroke-dasharray="5,5" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="550" y1="90" x2="400" y2="130" stroke="#4B8BBE" stroke-width="1" stroke-dasharray="5,5" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3.5s" repeatCount="indefinite"/>
  </line>
  
  <!-- Title Text (Minimalist) -->
  <text x="400" y="195" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#85C1E9" text-anchor="middle" letter-spacing="2">
    ALIENSEC MCP SERVER
    <animate attributeName="fill" values="#85C1E9;#4B8BBE;#85C1E9" dur="5s" repeatCount="indefinite"/>
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#5DADE2" text-anchor="middle" opacity="0.8">
    Security Scanning • AlienVault OTX • VirusTotal Integration
    <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite"/>
  </text>
  
  <!-- VRIL LABS Attribution -->
  <text x="100" y="220" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#4B8BBE" text-anchor="start" opacity="0.7">
    by VRIL LABS
    <animate attributeName="opacity" values="0.7;0.9;0.7" dur="6s" repeatCount="indefinite"/>
  </text>
  
  <text x="700" y="220" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#5DADE2" text-anchor="end" opacity="0.6">
    vril.li
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>